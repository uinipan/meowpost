<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf7f1">
  <title>喵邮局 · MeowPost</title>
  <link rel="icon" type="image/png" href="/app-icon.png?v=20261118-meowpost">
  <link rel="stylesheet" href="/style.css?v=20261118-navicons">
  <script type="module" src="/app.js?v=20261118-meowpost"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#search"><img class="brand-icon" src="/app-icon.png?v=20261118-meowpost" alt="喵邮局"><span>喵邮局<small>MEOWPOST</small></span></a>
    <div class="nav-label">我的图书馆</div>
    <nav aria-label="主导航">
      <button data-view="search" class="nav-item active"><span>⌕</span>搜索图书</button>
      <button data-view="popular" class="nav-item"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M12 21c4.1 0 6.8-2.8 6.8-6.3 0-2.6-1.4-4.5-2.9-5.8.1 2.6-1.8 3.5-1.8 3.5.3-4.5-2.2-6-3-9.4-2.1 2.4-5.9 7.2-5.9 11.7C5.2 18.2 7.9 21 12 21Z"/><path d="M12.1 13.4c.1 1.6-1.8 2.3-1.8 3.7a1.7 1.7 0 0 0 3.4 0c0-1.4-1.2-2.1-1.6-3.7Z"/></svg></span>热门图书</button>
      <button data-view="recommended" class="nav-item"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M3 5.5c3.4-.9 6.4-.2 9 1.6 2.6-1.8 5.6-2.5 9-1.6v14c-3.4-.9-6.4-.2-9 1.6-2.6-1.8-5.6-2.5-9-1.6Z"/><path d="M12 7.1v14M15.5 11h2.8M15.5 14h2.8"/><path d="M7.5 11.9c-.9-1.6-3-.7-2.1.8l2.1 2 2.1-2c.9-1.5-1.2-2.4-2.1-.8Z"/></svg></span>为你推荐</button>
      <button data-view="favorites" class="nav-item"><span>♡</span>我的收藏</button>
      <button data-view="history" class="nav-item"><span>◷</span>下载历史</button>
    </nav>
    <div class="nav-label nav-space">传送与管理</div>
    <nav aria-label="管理导航">
      <button data-view="transfers" class="nav-item"><span>⇄</span>传送任务<i id="task-count" hidden></i></button>
      <button data-view="accounts" class="nav-item"><span>♙</span>账号与连接</button>
      <button data-view="settings" class="nav-item"><span>⚙</span>偏好设置</button>
    </nav>
    <div class="sidebar-bottom">
      <div class="connection"><span class="status-dot" id="connection-dot"></span><div>微信读书<small id="sidebar-weread">正在检查连接</small></div><span>↗</span></div>
      <button class="user-card" data-view="accounts"><span class="avatar" id="avatar">读</span><span id="sidebar-name">我的阅读账号<small>查看账号与下载额度</small></span><span>›</span></button>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar"><span id="breadcrumb">我的图书馆 <b>/</b> 搜索图书</span><div class="topbar-right"><span class="local-pill"><i></i> 本机运行</span><button class="icon-button" id="theme-toggle" aria-label="切换明暗主题">◐</button></div></header>
    <main id="main" tabindex="-1"></main>
    <footer><span>喵邮局 · MeowPost</span><span>把想读的书，递到你的书架。</span></footer>
  </div>
  <dialog id="book-dialog" aria-labelledby="detail-title"><button class="dialog-close" aria-label="关闭">×</button><div id="book-detail"></div></dialog>
  <dialog id="qr-dialog" aria-labelledby="qr-title"><button class="dialog-close" aria-label="关闭">×</button><div class="qr-dialog"><span class="eyebrow">WECHAT READ</span><h2 id="qr-title">连接微信读书</h2><p id="qr-status">正在生成二维码…</p><canvas id="qr-canvas" width="320" height="320" aria-label="微信读书登录二维码"></canvas><button class="button secondary" id="qr-refresh">重新获取二维码</button><small>用手机微信扫码并确认登录</small></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
